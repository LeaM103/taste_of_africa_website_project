
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Tastes of Africa</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="recipes.html">Recipes</a>
            <a href="regions.html">Regions</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>

            <button id="theme-toggle" class="theme-toggle">
                🌙 Dark Mode
            </button>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Contact Us</h1>

            <p>
                Have a question about African food or want to share
                your favorite recipe? We would love to hear from you!
            </p>

            <form id="contact-form">

                <label for="name">Full Name:</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

                <label for="email">Email Address:</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="country">Country:</label>
                <input
                    type="text"
                    id="country"
                    name="country"
                    list="countries"
                    placeholder="Select or type your country"
                    required
                >

                <datalist id="countries">
                    <option value="Rwanda">
                    <option value="Kenya">
                    <option value="Nigeria">
                    <option value="Ghana">
                    <option value="Uganda">
                    <option value="Tanzania">
                    <option value="South Africa">
                    <option value="Ethiopia">
                </datalist>

                <label for="message">Your Message:</label>
                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Write your message here..."
                    required
                ></textarea>

                <button type="submit">Send Message</button>

            </form>

            <div id="thank-you-message"></div>

        </section>
    </main>

    <footer>
        <p>&copy; 2026 Tastes of Africa. All rights reserved.</p>
    </footer>

</body>
</html>
